# @package _global_

defaults:
  - data: TOY_DEFAULT
  - step_train_template: transitv_0v2
  - step_export_template: transit
  - step_export_latent: latent_sb1_sb2_sb_sr
  - step_export_SB1: default
  - step_export_SB2: default
  - step_export_SB1toSR: default
  - step_export_SB2toSR: default
  - step_evaluate: transit_TOY
  - override /step_train_template/model: TRANSITv25v11std.yaml
  - _self_

step_train_template:
  project_name: pad_transit
  do_scale_epochs: True
  trainer:
    check_val_every_n_epoch: 1
  #preprocessing_pkl: ${general.run_dir}/../data/data/preprocessor.pkl

delete_existing_run_dir: False

do_train_template: True
do_export_template: True
do_export_latent: True
do_transport_sideband: True
do_evaluation: True
do_cwola: False
do_evaluate_cwola: False
do_plot_compare: False

verbose_validation: True

general:
  name: TRANSITpad1v0toy2_leakysoftplus
  seed: 12345 # For reproducibility
  run_dir: /transit #workspaces/${general.subfolder}${general.name}
  do_dataset_plots: False
  
