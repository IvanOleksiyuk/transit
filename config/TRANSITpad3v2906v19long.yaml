# @package _global_
# TRANSITpad3v2906v19 with twice the training budget.
#
# batches_per_epoch_desired is a total-budget knob, not a per-epoch one:
# train_ptl.py computes epoch_scale = batches_per_epoch_desired / num_batches and
# multiplies max_epochs (and the adversarial scheduler milestones and warmup) by
# it, so the total number of optimizer steps is max_epochs * this value. Going
# 800 -> 1600 therefore doubles the training, independently of the dataset size.
#
# Measured on TRANSITpad3v2906v19_sig500_nxgboost: 800 gave max_epochs 517 and a
# 3 h 13 m train_and_export step, so expect ~6.5 h here — above the 240 min the
# baobab_production profile allows for train_and_export_transit, which the job
# script raises with --set-resources.

defaults:
  - data: PAD_DEFAULT_binmix
  - step_train_template: transitv_0v2
  - step_export_template: transit
  - step_evaluate: transit_PAD
  - override /step_train_template/model: TRANSITpad3v2906v19.yaml
  - _self_

step_train_template:
  project_name: pad_transit
  do_scale_epochs: True
  trainer:
    check_val_every_n_epoch: 10
  batches_per_epoch_desired: 1600
  model:
    valid_plot_freq: 9
  preprocessing_pkl: ${general.run_dir}/../data/data/preprocessor.pkl

delete_existing_run_dir: False

do_train_template: True
do_export_template: True
do_transport_sideband: False
do_export_latent: False
do_evaluation: False
do_cwola: False
do_evaluate_cwola: False
do_plot_compare: False

data:
  training_batch_size: 4096

verbose_validation: True

general:
  name: TRANSITpad3v2906v19long
  seed: 12345 # For reproducibility
  run_dir: /transit #workspaces/${general.subfolder}${general.name}
  do_dataset_plots: False
