# @package _global_

defaults:
  - data: PAD_DEFAULT_halfhalf
  - step_train_template: transitv_0v2
  - step_export_template: transit
  - step_evaluate: transit_PAD
  - override /step_train_template/model: TRANSITpad3v3_curvk05.yaml
  - _self_

step_train_template:
  project_name: pad_transit
  do_scale_epochs: True
  trainer:
    # full_stat (33x pseudodata): epochs are scaled down with the data size
    # (do_scale_epochs), so validate every epoch, as the other *_full_stat configs do
    check_val_every_n_epoch: 1
  batches_per_epoch_desired: 400
  model:
    valid_plot_freq: 1
  preprocessing_pkl: ${general.run_dir}/../data/data/preprocessor.pkl

delete_existing_run_dir: False

do_train_template: True
do_export_template: True
do_transport_sideband: False
do_export_latent: False
do_evaluation: False
do_cwola: False
do_evaluate_cwola: False
do_plot_compare: False

data:
  training_batch_size: 2048
  # Fast data loading (2026-09-30): whole batches from numpy views of the frames
  # (src.data.data.BatchFetchConcatDataset) instead of one pandas row per event, so no
  # loader workers are needed. That also removes the forked-worker CUDA crash these
  # curvature runs hit, which had forced a num_workers=0 workaround on the slow per-row
  # path (5h49 per training). Benchmark: 1.14 s/epoch on an RTX A5000
  # (user/studies/curvature_speed_2026-09-29/).
  template_training:
    batched_fetch: true
    loader_kwargs:
      num_workers: 0
      persistent_workers: false

verbose_validation: True

general:
  name: TRANSITpad3v3
  seed: 12345 # For reproducibility
  run_dir: /transit #workspaces/${general.subfolder}${general.name}
  do_dataset_plots: False
  
