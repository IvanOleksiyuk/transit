training_batch_size: 2048

template_training:
  _target_: src.data.data.SimpleDataModule
  train_frac: 0.8
  train_data:
    _target_: src.data.data.CombDataset
    dataset1: 
      _target_: src.data.data.InMemoryDataFrameDict
      list_order: ["data", "cond"]
      file_path: "${general.run_dir}/../data/data/sb.h5"
      plotting_path: "${general.run_dir}/plots/sb"
      processor_cfg:
        - _target_: src.data.process.ProcessorShuffle
          random_state: ${general.seed}
          add_seed: 1000
        - _target_: src.data.process.ProcessorKeepFrames
          frame_names_to_keep: ["data", "cond"]
        - _target_: src.data.process.ProcessorFlatMassResampling
          mass_frame: "cond"
          mass_variable: "m_jj"
          n_bins: 50
          plot_path: "${general.run_dir}/plots/sb/m_jj_flat_resampling.png"
    dataset2:
      _target_: src.data.data.InMemoryDataFrameDict
      file_path: ["${general.run_dir}/../data/data/sb.h5", "${general.run_dir}/../data/data/sr.h5"]
      plotting_path: "${general.run_dir}/plots/sbsr"
      list_order: ["mass_add"]
      processor_cfg:
        - _target_: src.data.process.ProcessorShuffle
          random_state: ${general.seed}
          add_seed: 2000
        - _target_: src.data.process.ProcessorSplitDataFrameVars
          frame_name: "cond"
          new_df_dict:
            mass_add: ["m_jj"]
        - _target_: src.data.process.ProcessorKeepFrames
          frame_names_to_keep: ["mass_add"]
        - _target_: src.data.process.ProcessorFlatMassResampling
          mass_frame: "mass_add"
          mass_variable: "m_jj"
          n_bins: 50
          plot_path: "${general.run_dir}/plots/sbsr/m_jj_flat_resampling.png"
  loader_kwargs:
    pin_memory: true
    batch_size: ${data.training_batch_size}
    num_workers: 16
    drop_last: true
    persistent_workers: True



