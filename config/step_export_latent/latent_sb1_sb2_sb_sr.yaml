several_confs:
  sr:
    seed: ${general.seed} 
    data: ${data.export_latent_sr} 

    paths:
      # output dir will be created by hydra
      full_path:  ${general.run_dir}/template
      output_dir:  ${general.run_dir}/

    output_name: latransit_sr
    get_best: false
    network_name: ${step_train_template.network_name}
    latent_df_key: "data"
    retain_dfs: ["orig", "is_signal"]
