# ---------------------------------------------------------------------------
# TRANSITpad3v2906v13 + Shake-Shake residual blocks, Shake-Even-Image with
# per-step coefficients (2026-09-21). Identical to TRANSITpad3v2906v13.yaml
# (lr 2e-4) except `shake_shake` / `shake_shake_cfg` on encoder and decoder.
#
# Lessons from the first attempt (TRANSITpad3v2906v13_lr2x_shake, S-S-I, fresh
# draws on every forward call, 2x lr): it diverged -- valid reco 4000x worse,
# rotationality 20x, cycle consistency 2500x, train reco 7.8 +- 10. TRANSIT's
# loss compares several passes of the network per step (cycle consistency,
# parallelity/rotationality at x and x+eps), and with an independent draw per
# pass those terms measure the shake noise instead of the model. Hence:
#   per_step: true     coefficients drawn once per training step and reused
#                      by every pass of that step (TRANSIT.on_train_batch_start
#                      resamples) -- the losses compare the same function
#   backward_mode even  b = 0.5 (Shake-Even): gradient of the mean network at
#                      the a-mixed activations; no extra backward noise. Best
#                      row of the paper's Table 1 and its choice without BN
#   forward a in [0,1]  kept at the full range on purpose (the paper narrowed
#                      it to [0.4,0.6] for its no-BN net; try that next if
#                      this still misbehaves)
#   lr 2e-4            not stacked with the lr experiment
# ---------------------------------------------------------------------------
defaults:
  - _self_
  - optimizer: AdamW_lr2-4.yaml
  - scheduler: cyclic.yaml

network_type: partial_context
_target_: transit.src.models.transit_model.TRANSIT
use_m_encodig: True
encoder_cfg:
  _target_: transit.mattstools.mattstools.modules_myy.DenseNetwork
  _partial_: true
  act_h: silu
  act_i: none
  nrm: none
  hddn_dim: 128
  num_blocks: 6
  n_lyr_pbk: 3
  do_res: True
  scale_residual: True
  scale_output_hidden: "pm1"
  shake_shake: True          # Shake-Shake residual blocks (arXiv:1705.07485)
  shake_shake_cfg:
    forward_mode: shake      # a ~ U(0,1) per sample, full range
    backward_mode: even      # b = 0.5: Shake-Even, the paper's best/most stable row
    level: image
    per_step: true           # one draw per training step, shared by all passes
  ctxt_in_inpt: True
  ctxt_in_hddn: True
  ctxt_in_out: False
decoder_cfg:
  _target_: transit.mattstools.mattstools.modules_myy.DenseNetwork
  _partial_: true
  act_h: silu
  act_i: none
  nrm: none
  hddn_dim: 128
  num_blocks: 6
  n_lyr_pbk: 3
  do_res: True
  scale_residual: True
  scale_output_hidden: "pm1"
  shake_shake: True          # Shake-Shake residual blocks (arXiv:1705.07485)
  shake_shake_cfg:
    forward_mode: shake      # a ~ U(0,1) per sample, full range
    backward_mode: even      # b = 0.5: Shake-Even, the paper's best/most stable row
    level: image
    per_step: true           # one draw per training step, shared by all passes
  ctxt_in_inpt: True
  ctxt_in_hddn: True
  ctxt_in_out: False
latent_norm: False
latent_dim: auto
loss_cfg:
  reco:
    w: 1
  consistency_x:
    w: 0.2
  latent_variance_cfg:
    w: 0.02
    pow: 1
    random_rotation: true
  latent_mean_cfg:
    w: 0.02
  # SIGReg (LeJEPA) latent Gaussianisation, replacing the projected latent-ED-gaussian.
  latent_sigreg_cfg:
    w: 0.04
    num_slices: 20
    t_max: 3.0
    n_points: 17
  rot_loss_cfg:
    w: 0.05
    eps_scale: 0.01

# Monitor-only discriminator: kept so the (reco) discriminator still trains and we
# can see what it finds "wrong" with the transport, but BOTH generator weights are
# 0 so it does NOT influence training. This also restores the adversarial path's
# MultiStepLR (staircase) scheduling + the epoch-scaling in train_ptl.py.
adversarial_cfg:
  mode: "double_discriminator"
  label_smoothing_eps: 0.1
  discriminator2:
    _target_: transit.mltools.mlp.MLP
    _partial_: true
    outp_dim: 1
    hddn_dim: [64, 64, 64, 64]
    ctxt_in_hddn: True
    ctxt_in_inpt: True
    act_h: "prelu"
    act_o: "sigmoid"
  optimizer_main: default.yaml
  optimizer_d: default.yaml
  warmup: 0 #Number of warmup epochs
  warmup_steps: 200 #Number of wamup steps after the end of warmup epochs
  g_loss_weight: 0       # latent-discriminator generator weight (no latent disc anyway)
  g_loss_gen_weight: 0   # reco-discriminator generator weight: 0 => monitor only, no influence
  every_n_steps_g: 1
  train_dis_in_warmup: False
  g_loss_weight_in_warmup: False
  loss_function: "binary_cross_entropy"
  scheduler:
    scheduler_g:
      _target_: torch.optim.lr_scheduler.MultiStepLR
      _partial_: True
      milestones: [30, 100, 150, 175, 200, 250]
      gamma: 0.5
    scheduler_d:
      _target_: torch.optim.lr_scheduler.MultiStepLR
      _partial_: True
      milestones: [30, 100, 150, 175]
      gamma: 0.5
    scheduler_d2:
      _target_: torch.optim.lr_scheduler.MultiStepLR
      _partial_: True
      milestones: [30, 100, 150, 175]
      gamma: 0.5
  gradient_clip_val: 0.1

ema_cfg:
  enabled: True
  decay: 0.98
  update_every: 1

# No additional input noise (as in v6).
input_noise_cfg: null

valid_plots: ${verbose_validation}
add_standardizing_layer: True
reverse_pass_mode: additional_input
afterglow_epoch: 999999999
