defaults:
  - _self_
  - optimizer: AdamW_lr5-4.yaml
  - scheduler: cyclic.yaml

network_type: partial_context
_target_: transit.src.models.transit_model.TRANSIT
use_m_encodig: True
encoder_cfg:
  _target_: transit.mattstools.mattstools.modules_myy_modulated.SingleLayerMultiHeadContextOnlyVBetaNetwork
  _partial_: true
  act: silu
  gate_uses_ctxt: True
  nrm: none
  num_heads: 8
decoder_cfg:
  _target_: transit.mattstools.mattstools.modules_myy_modulated.SingleLayerMultiHeadContextOnlyVBetaNetwork
  _partial_: true
  gate_uses_ctxt: False
  act: silu
  nrm: none
  num_heads: 8
latent_norm: False
latent_dim: 6
loss_cfg:
  reco:
    w: 1
  consistency_x:
    w: 0.2
  latent_variance_cfg:
    w: 0.001
    pow: 1

adversarial_cfg:
  mode: "double_discriminator_priority"
  discriminator2:
    _target_: transit.mltools.mlp.MLP
    _partial_: true
    outp_dim: 1
    hddn_dim: [32, 32, 32]
    ctxt_in_hddn: True
    ctxt_in_inpt: True
    act_h: "silu"
    act_o: "sigmoid"
  optimizer_main: default.yaml
  optimizer_d: default.yaml
  warmup: 5
  g_loss_weight: 0
  g_loss_gen_weight: 0.5
  every_n_steps_g: 1
  train_dis_in_warmup: False
  g_loss_weight_in_warmup: True
  loss_function: "binary_cross_entropy"
  scheduler:
    scheduler_g:
      _target_: torch.optim.lr_scheduler.MultiStepLR
      _partial_: True
      milestones: [30, 100, 150, 175, 200, 250]
      gamma: 0.5
    scheduler_d:
      _target_: torch.optim.lr_scheduler.MultiStepLR
      _partial_: True
      milestones: [30, 100, 150, 175]
      gamma: 0.5
    scheduler_d2:
      _target_: torch.optim.lr_scheduler.MultiStepLR
      _partial_: True
      milestones: [30, 100, 150, 175]
      gamma: 0.5
  gradient_clip_val: 0.1

input_noise_cfg:
  noise_std: 0.1

valid_plots: ${verbose_validation}
add_standardizing_layer: True
reverse_pass_mode: additional_input
afterglow_epoch: 999999999
