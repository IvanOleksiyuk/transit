defaults:
  - _self_
  - model: TRANSITv25f.yaml
  - callbacks: default.yaml
  - loggers: wandb.yaml
  - paths: default.yaml
  - trainer: default.yaml
  - data: default.yaml

project_name: transit # Determines output directory path and wandb project
network_name: ${general.name}_${now:%Y-%m-%d}_${now:%H-%M-%S-%f} # Used for both saving and wandb
ckpt_path: null # Checkpoint path to resume training
precision: highest # true FP32 matmuls: with "high" (TF32 on Ampere+) the finite-difference rotationality/parallelity losses are dominated by rounding noise on A100/H100 (2026-11-10)
compile: null # Can set to default for faster compiles
full_resume: False
seed: ${general.seed} 
automatic_optimization: False

